name: Loopit 2.0 Program Core

on:
  push:
    branches:
      - loopit-2.0/program-core-clean
  pull_request:
    branches:
      - master
    paths:
      - "lib/v2/program/**"
      - "scripts/test-v2-program.mts"
      - "prisma/schema-v2.prisma"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/loopit-v2-program-core.yml"
  workflow_dispatch:

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loopit_ci
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/loopit_ci_shadow

jobs:
  program-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:v2:validate
      - run: npm run prisma:v2:generate
      - run: npm run typecheck
      - run: node --experimental-strip-types --test lib/v2/program/service.test.ts
      - run: node --experimental-strip-types scripts/test-v2-program.mts
