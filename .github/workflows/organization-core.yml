name: Loopit 2.0 Organization Core

on:
  workflow_dispatch:
  push:
    paths:
      - "lib/v2/organization/**"
      - "prisma/schema-v2.prisma"
      - "scripts/validate-loopit-v2-schema.mjs"
      - "scripts/test-v2-postgres.mjs"
      - "scripts/test-v2-organization.mts"
      - "scripts/test-v2-organization-service.mts"
      - "tsconfig.json"
      - ".github/workflows/organization-core.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "lib/v2/organization/**"
      - "prisma/schema-v2.prisma"
      - "scripts/validate-loopit-v2-schema.mjs"
      - "scripts/test-v2-postgres.mjs"
      - "scripts/test-v2-organization.mts"
      - "scripts/test-v2-organization-service.mts"
      - "tsconfig.json"
      - ".github/workflows/organization-core.yml"
      - "package.json"
      - "package-lock.json"

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loopit_ci
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/loopit_ci_shadow

jobs:
  organization-core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loopit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d loopit_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create Prisma shadow database
        run: PGPASSWORD=postgres createdb -h localhost -U postgres loopit_ci_shadow

      - name: Validate Loopit 2.0 schema
        run: npm run prisma:v2:validate

      - name: Generate Loopit 2.0 Prisma Client
        run: npm run prisma:v2:generate

      - name: Validate Loopit 2.0 core schema
        run: npm run test:v2:core-schema

      - name: Prepare PostgreSQL schema
        run: npx prisma db push --schema=prisma/schema-v2.prisma

      - name: Test PostgreSQL connectivity
        run: npm run test:v2:postgres

      - name: Test OrganizationRepository CRUD
        run: node --experimental-strip-types --test scripts/test-v2-organization.mts

      - name: Test OrganizationService business rules
        run: node --experimental-strip-types --test scripts/test-v2-organization-service.mts

      - name: TypeScript validation
        run: npm run typecheck
