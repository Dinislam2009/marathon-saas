name: Loopit 2.0 Organization Core

on:
  workflow_dispatch:
  push:
    paths:
      - "lib/v2/organization/**"
      - ".github/workflows/organization-core.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "lib/v2/organization/**"
      - ".github/workflows/organization-core.yml"
      - "package.json"
      - "package-lock.json"

jobs:
  organization-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npx tsc --noEmit
