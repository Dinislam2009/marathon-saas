name: Loopit 2.0 Schema CI

on:
  push:
    branches:
      - 'loopit-2.0/schema-validation'
  pull_request:
    branches:
      - 'loopit-2.0/schema-validation'

jobs:
  validate-schema:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loopit_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Loopit 2.0 schema
        run: npx prisma validate --schema=prisma/schema-v2.prisma
