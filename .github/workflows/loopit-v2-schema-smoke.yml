name: Loopit 2.0 Schema Smoke

on:
  push:
    branches:
      - 'loopit-2.0/schema-validation'

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loopit_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/loopit_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Validate Loopit 2.0 schema
        run: npx prisma validate --schema=prisma/schema-v2.prisma
