name: Fix stale case-sensitive action references

on:
  push:
    branches:
      - loopit-2.0/production-fix

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: loopit-2.0/production-fix
          fetch-depth: 0

      - name: Replace stale action references
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'actions.gettasksByMarathon': 'actions.getTasksByMarathon',
              'actions.getstudentsByMarathonId': 'actions.getStudentsByMarathonId',
              'actions.getmarathonById': 'actions.getMarathonById',
              'actions.getcuratorsByMarathonId': 'actions.getCuratorsByMarathonId',
          }

          for path in Path('app').rglob('*.js'):
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No stale action references found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "fix: remove stale case-sensitive action references"
          git push origin HEAD:loopit-2.0/production-fix
