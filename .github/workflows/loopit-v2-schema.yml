name: Loopit 2.0 Schema Validation

on:
  push:
    paths:
      - "prisma/schema-v2.prisma"
      - "prisma/schema.prisma"
      - "prisma.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/validate-loopit-v2-schema.mjs"
  pull_request:
    paths:
      - "prisma/schema-v2.prisma"
      - "prisma/schema.prisma"
      - "prisma.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/validate-loopit-v2-schema.mjs"

jobs:
  validate-loopit-v2-schema:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loopit_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/loopit_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Loopit 2.0 schema
        run: npm run prisma:v2:validate

      - name: Generate Loopit 2.0 Prisma Client
        run: npm run prisma:v2:generate

      - name: Check Loopit 2.0 core models
        run: npm run test:v2:core-schema
