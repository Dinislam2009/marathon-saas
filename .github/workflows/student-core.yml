name: Loopit 2.0 Student Core

on:
  push:
    branches:
      - 'loopit-2.0/student-core'
  pull_request:
    branches:
      - master

jobs:
  student-core:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loopit_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/loopit_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate V2 schema
        run: npm run prisma:v2:validate

      - name: Typecheck
        run: npm run typecheck
