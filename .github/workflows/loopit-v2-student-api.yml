name: Loopit 2.0 Student API

on:
  push:
    branches:
      - loopit-2.0/student-api
  pull_request:
    branches:
      - master
    paths:
      - "app/api/v2/organizations/**/students/**"
      - "lib/v2/student/**"
      - "lib/v2/prisma.ts"
      - "prisma/schema-v2.prisma"
      - "scripts/test-v2-student-api.mts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/loopit-v2-student-api.yml"
  workflow_dispatch:

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loopit_ci
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/loopit_ci_shadow

jobs:
  student-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:v2:validate
      - run: npm run prisma:v2:generate
      - run: npm run typecheck
      - run: node --experimental-strip-types --test scripts/test-v2-student-api.mts
