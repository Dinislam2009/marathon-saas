name: Loopit 2.0 API Contracts

on:
  push:
    branches:
      - loopit-2.0/api-contract-tests
  pull_request:
    branches:
      - master
    paths:
      - "app/api/v2/**"
      - "lib/v2/**"
      - "scripts/test-v2-api-contracts.mts"
      - "scripts/test-v2-rbac.mts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/loopit-v2-api-contracts.yml"
  workflow_dispatch:

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loopit_ci
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/loopit_ci_shadow

jobs:
  api-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:v2:validate
      - run: npm run prisma:v2:generate
      - run: npm run test:v2:api-contracts
      - run: npm run test:v2:rbac
      - run: npm run typecheck
