name: Loopit 2.0 Group Core

on:
  push:
    branches:
      - loopit-2.0/group-core
  pull_request:
    branches:
      - master
    paths:
      - "lib/v2/group/**"
      - "scripts/test-v2-group.mts"
      - "prisma/schema-v2.prisma"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/loopit-v2-group-core.yml"
  workflow_dispatch:

jobs:
  group-core:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loopit_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/loopit_ci_shadow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:v2:validate
      - run: npm run prisma:v2:generate
      - run: npm run typecheck
      - run: node --experimental-strip-types --test lib/v2/group/service.test.ts
      - run: node --experimental-strip-types scripts/test-v2-group.mts
